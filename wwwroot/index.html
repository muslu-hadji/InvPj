<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .balance { font-size: 32px; font-weight: bold; color: #2ecc71; margin: 15px 0; }
        .label { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">Общий капитал в управлении</div>
        <div class="balance" id="balance">Загрузка...</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Функция запроса данных с нашего сервера
        async function loadBalance() {
            try {
                const response = await fetch('/api/balance');
                const data = await response.json();
                document.getElementById('balance').innerText = data.totalBalance.toLocaleString() + ' ₽';
            } catch (e) {
                document.getElementById('balance').innerText = 'Ошибка сети';
            }
        }

        loadBalance();
    </script>
</body>
</html>
