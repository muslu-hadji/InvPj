<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvPj</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 300px; text-align: center; margin-bottom: 20px; }
        .balance { color: #2ecc71; font-size: 32px; font-weight: bold; }
        input { width: 85%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        button { background: #3498db; color: white; border: none; padding: 12px; border-radius: 10px; width: 92%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status" style="font-size: 10px; color: orange;">Проверка связи...</div>
        <div class="label">Общий капитал</div>
        <div id="balance" class="balance">0 ₽</div>
    </div>
    <div class="card">
        <input type="text" id="name" placeholder="Имя">
        <input type="number" id="amount" placeholder="Сумма (₽)">
        <button onclick="sendData()">Добавить</button>
    </div>
    <script>
        async function load() {
            try {
                const r = await fetch('/api/balance');
                const d = await r.json();
                document.getElementById('balance').innerText = d.totalBalance.toLocaleString() + ' ₽';
                document.getElementById('status').innerText = "Связь установлена ✅";
            } catch(e) { 
                document.getElementById('status').innerText = "Ошибка API: " + e.message;
            }
        }
        async function sendData() {
            const n = document.getElementById('name').value;
            const a = document.getElementById('amount').value;
            if(!n || !a) return;
            await fetch('/api/investors', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: n, availableBalance: parseFloat(a) })
            });
            location.reload();
        }
        load();
    </script>
</body>
</html>
